.bolt{position:absolute;top:-70px;left:120px;width:120px;height:240px;opacity:0;fill:none;stroke:#fff6a0;stroke-width:10;filter:drop-shadow(0 0 12px #ffe14a) drop-shadow(0 0 26px #ff8a00)}
.bolt.b2{left:auto;right:110px;top:-40px;transform:scaleX(-1)}

.rays{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,60,.55) 0 7deg,rgba(255,60,30,0) 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0 25%,transparent 62%);mask:radial-gradient(circle,#000 0 25%,transparent 62%)}
.num{position:relative;display:flex;align-items:baseline;gap:20px}
.nv{font-size:250px;line-height:1.1;color:var(--red);paint-order:stroke fill;-webkit-text-stroke:18px #fff;filter:drop-shadow(0 0 24px rgba(255,20,20,.95)) drop-shadow(0 12px 0 rgba(0,0,0,.45))}
.nu{font-size:96px;color:#fff;text-shadow:0 6px 0 var(--dark),0 0 20px rgba(0,0,0,.7)}
#fx{position:absolute;inset:0;pointer-events:none}
.spk{position:absolute;top:0;border-radius:50%;background:radial-gradient(circle,#fff7c0,#ffb020 45%,rgba(255,60,0,0) 70%);box-shadow:0 0 12px #ff8a00}
