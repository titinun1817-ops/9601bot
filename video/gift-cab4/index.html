<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<title>ของแถม CAB4 15s</title>
<style>
@font-face{font-family:K;font-weight:900;font-style:italic;src:url(fonts/kanit-thai-900-italic.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:900;font-style:italic;src:url(fonts/kanit-latin-900-italic.woff2);unicode-range:U+0000-024F,U+20AC,U+0E3F,U+2122}
@font-face{font-family:K;font-weight:800;font-style:normal;src:url(fonts/kanit-thai-800-normal.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:800;font-style:normal;src:url(fonts/kanit-latin-800-normal.woff2);unicode-range:U+0000-024F}
@font-face{font-family:K;font-weight:800;font-style:italic;src:url(fonts/kanit-thai-800-italic.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:800;font-style:italic;src:url(fonts/kanit-latin-800-italic.woff2);unicode-range:U+0000-024F}
:root{--red:#E3202A;--ink:#17181C;--paper:#EDE6D8;--blue:#1F3A93;--green:#5BB947}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:K,sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#24262d 0%,#17181C 70%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:90px 90px}
#wave{position:absolute;left:0;top:1480px;width:1080px;height:440px}
.scene{position:absolute;inset:0;opacity:0}
.c{position:absolute;left:0;right:0;text-align:center}
.h1{font-weight:900;font-style:italic;font-size:118px;line-height:1.25;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-style:italic;padding:6px 44px 18px;transform:rotate(-2deg);clip-path:polygon(0 4%,8% 0,30% 5%,55% 0,80% 4%,100% 0,98% 50%,100% 96%,75% 100%,50% 95%,25% 100%,0 97%,2% 50%)}
.pill{display:inline-block;border:5px solid #fff;border-radius:60px;padding:2px 40px 10px;font-weight:800;font-style:italic;font-size:46px;background:var(--ink)}
.paper{position:absolute;background:var(--paper);color:var(--ink)}
.num{font-weight:900;font-style:italic;color:var(--red);font-variant-numeric:tabular-nums}
.check{position:absolute;width:120px;height:120px;border-radius:50%;background:var(--green);border:8px solid #fff;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:16px;justify-content:center}
.dots i{display:block;width:18px;height:18px;border-radius:10px;background:#666}
.dots i.on{width:56px;background:var(--red)}
.tile{position:absolute;width:470px;height:145px;text-align:center;color:var(--ink)}
.tile .l{font-weight:800;font-size:38px;line-height:1.3;padding-top:14px}
.tile .v{font-weight:900;font-style:italic;font-size:62px;color:var(--red);line-height:1.1}
.btn{display:inline-block;background:var(--red);border:10px solid #fff;border-radius:60px;padding:6px 90px 34px;font-weight:900;font-style:italic;font-size:200px;line-height:1.15;box-shadow:0 22px 0 #9c1018}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<svg id="wave" viewBox="0 0 1080 440" preserveAspectRatio="none"><path id="wB" fill="#1F3A93"/><path id="wR" fill="#E3202A"/><path id="wD" fill="#141519"/></svg>

<!-- S1 hook -->
<div class="scene" id="s1">
  <div class="c h1" id="s1a" style="top:300px">มือสองที่ไหน</div>
  <div class="c" id="s1b" style="top:445px"><span class="tag" style="font-size:112px">แถมให้ขนาดนี้?!</span></div>
  <div class="c" id="s1c" style="top:690px"><span class="pill">มูลค่าของแถม</span></div>
  <div class="paper" id="s1d" style="left:70px;width:940px;top:800px;height:290px">
    <div class="num c" id="s1n" style="top:30px;font-size:190px">฿0</div>
  </div>
  <div class="c" id="s1e" style="top:1140px"><span class="pill" style="font-size:44px;border-color:#B9BDC6;color:#fff">รุ่น CAB4 ปี 2020 ขึ้นไป</span></div>
</div>

<!-- S2-4 item cards -->
<div class="scene" id="sI">
  <div class="c" style="top:250px"><span class="pill">ของแถมเต็มคัน</span></div>
  <div class="dots c" style="top:360px;position:absolute"><i id="d0"></i><i id="d1"></i><i id="d2"></i></div>
  <div id="cardWrap" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
    <div class="paper" id="card" style="left:90px;width:900px;top:450px;height:620px">
      <div class="c" id="ct" style="top:40px;font-weight:900;font-style:italic;font-size:96px;line-height:1.25"></div>
      <div class="c" id="cs" style="top:175px;font-weight:900;font-style:italic;font-size:58px;line-height:1.3"></div>
      <div class="num c" id="cn" style="top:270px;font-size:200px;line-height:1.2"></div>
      <div class="c" style="top:515px;font-weight:800;font-size:58px">บาท</div>
    </div>
    <div class="check" id="ck" style="left:915px;top:395px"><svg width="70" height="70" viewBox="0 0 24 24"><path id="ckp" d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26" stroke-dashoffset="26"/></svg></div>
  </div>
</div>

<!-- S5 grid -->
<div class="scene" id="s5">
  <div class="c" id="s5a" style="top:150px"><span class="tag" style="font-size:118px">แถมอีกเพียบ!</span></div>
  <div id="tiles"></div>
  <div class="c" id="s5b" style="top:1165px;font-weight:900;font-style:italic;font-size:70px">รวมมูลค่า</div>
  <div class="c" id="s5n" style="top:1240px;font-weight:900;font-style:italic;font-size:200px;line-height:1.1;text-shadow:0 12px 0 var(--red)">0</div>
  <div class="c" id="s5c" style="top:1478px;font-weight:800;font-size:31px;line-height:1.45;color:#fff;z-index:5">*เฉพาะรถที่ร่วมรายการ มูลค่าของแถมแต่ละคันอาจต่างกัน<br>*เบาะหนัง บางคันไม่ได้เปลี่ยน</div>
</div>

<!-- S6 CTA -->
<div class="scene" id="s6">
  <div class="c h1" id="s6a" style="top:470px;font-size:150px">สนใจ</div>
  <div class="c" id="s6b" style="top:680px"><span class="btn">ทักแชท</span></div>
  <svg id="chev" style="position:absolute;left:480px;top:1040px" width="120" height="120" viewBox="0 0 24 24"><path d="M5 6l7 6 7-6M5 13l7 6 7-6" fill="none" stroke="#B9BDC6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;x=clamp(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fmt=n=>Math.round(n).toLocaleString('en-US');
// torn paper edges (seeded)
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function torn(el,j=1.2){const p=[];const n=26;
  for(let i=0;i<=n;i++)p.push(`${i/n*100}% ${rnd()*j*1.6}%`);
  for(let i=0;i<=8;i++)p.push(`${100-rnd()*j*0.6}% ${i/8*100}%`);
  for(let i=n;i>=0;i--)p.push(`${i/n*100}% ${100-rnd()*j*1.6}%`);
  for(let i=8;i>=0;i--)p.push(`${rnd()*j*0.6}% ${i/8*100}%`);
  el.style.clipPath=`polygon(${p.join(',')})`;}
// grid tiles
const T=[["จอแอนดรอยด์+กล้องถอย",9333],["เบาะหนัง*",6000],["อะไหล่สึกหรอ",6436],["น้ำมัน+น้ำยาครบชุด",5119],["แบตเตอรี่",3418],["พ่นกันสนิม",2060],["ฟิล์มรอบคัน",2000],["กรอง 4 ตัว",1718],["ล้างทำความสะอาด",1605],["ตรวจเช็ค 220 รายการ",1070]];
T.forEach((x,i)=>{const d=document.createElement('div');d.className='tile paper';d.id='t'+i;
  d.style.left=(60+(i%2)*490)+'px';d.style.top=(340+Math.floor(i/2)*160)+'px';
  d.innerHTML=`<div class="l">${x[0]}</div><div class="v">${fmt(x[1])}</div>`;$('tiles').appendChild(d);torn(d,1.6);});
torn($('s1d'),1.4);torn($('card'),1);
const ITEMS=[
 {t0:2.6,t1:4.6,title:"ทำสีรอบคัน",sub:"",val:65000,dir:1},
 {t0:4.6,t1:6.6,title:"ล้อแม็กซ์",sub:"+ ยางใหม่ + ตั้งศูนย์",val:23535,dir:-1},
 {t0:6.6,t1:8.8,title:"ประกันชั้น 1",sub:"+ พ.ร.บ.",val:14176,dir:1},
];
const W=0.16; // whip half-length
function whip(el,t,a,b,dir){ // slide in at a, out at b
  let x=0,bl=0;
  if(t<a+W){const p=eo(prog(t,a,W));x=(1-p)*1100*dir;bl=(1-p)*40;}
  else if(t>b-W){const p=prog(t,b-W,W);x=-p*p*1100*dir;bl=p*40;}
  el.style.transform=`translateX(${x}px)`;el.style.filter=bl>0.5?`blur(${bl}px)`:'none';}
function vis(id,t,a,b){const e=$(id);const on=t>=a&&t<b;e.style.opacity=on?1:0;return on?e:null;}
function pop(el,t,a,d=.32){const p=prog(t,a,d);el.style.opacity=p>0?1:0;el.style.transform=`scale(${0.3+0.7*back(p)})`;}
function wipe(el,t,a,d=.28){const p=eo(prog(t,a,d));el.style.clipPath=`inset(-20% ${100-p*100}% -20% 0)`;}
function waves(t){
  const mk=(base,amp,ph,k)=>{let d=`M0 440 L0 ${base}`;for(let x=0;x<=1080;x+=30){const y=base+amp*Math.sin(x/1080*Math.PI*k+ph)+amp*.4*Math.sin(x/1080*Math.PI*k*2.3+ph*1.7);d+=` L${x} ${y}`;}return d+' L1080 440 Z';};
  $('wB').setAttribute('d',mk(110,34,t*1.6,1.6));$('wR').setAttribute('d',mk(200,40,t*1.9+2,1.4));$('wD').setAttribute('d',mk(300,30,t*1.3+4,1.2));
  // dark band below waves
  $('wR').nextElementSibling;
}
function seek(t){
  waves(t);
  // S1 hook 0-2.6
  const s1=vis('s1',t,0,2.6);
  if(s1){whip(s1,t,-1,2.6,1);
    pop($('s1a'),t,0.05);
    const b=$('s1b');wipe(b,t,1.15);b.style.opacity=t>=1.15?1:0;
    pop($('s1c'),t,0.25);pop($('s1d'),t,0.3);
    const p=eo(prog(t,0.45,1.5));$('s1n').textContent='฿'+fmt(141470*p);
    const land=prog(t,1.95,.25);$('s1n').style.transform=`scale(${1+0.12*Math.sin(land*Math.PI)})`;
    pop($('s1e'),t,1.55);}
  // S2-4 items
  const sI=vis('sI',t,2.6,8.8);
  if(sI){whip(sI,t,2.6,8.8,1);
    const it=ITEMS.find(x=>t>=x.t0&&t<x.t1)||ITEMS[2];const i=ITEMS.indexOf(it);
    ['d0','d1','d2'].forEach((d,k)=>$(d).className=k===i?'on':'');
    const cw=$('cardWrap');
    if(i===0) cw.style.transform='none',cw.style.filter='none'; else whip(cw,t,it.t0,99,it.dir);
    if(i<2){const nx=ITEMS[i+1];if(t>nx.t0-W)whip(cw,t,-9,nx.t0,it.dir);}
    $('ct').textContent=it.title;$('cs').textContent=it.sub;
    $('cs').style.opacity=prog(t,it.t0+.25,.15);
    const p=eo(prog(t,it.t0+.45,.85));$('cn').textContent=fmt(it.val*p);
    const land=prog(t,it.t0+1.3,.25);$('cn').style.transform=`scale(${1+0.14*Math.sin(land*Math.PI)})`;
    pop($('ck'),t,it.t0+1.32,.3);$('ckp').style.strokeDashoffset=26*(1-eo(prog(t,it.t0+1.45,.25)));}
  // S5 grid 8.8-12.6
  const s5=vis('s5',t,8.8,12.6);
  if(s5){whip(s5,t,8.8,12.6,-1);
    const a=$('s5a');wipe(a,t,8.95);a.style.opacity=t>=8.95?1:0;
    T.forEach((x,i)=>pop($('t'+i),t,9.2+i*0.1,.28));
    pop($('s5b'),t,10.35,.25);
    const p=eo(prog(t,10.45,1.45));const n=$('s5n');n.style.opacity=t>=10.4?1:0;n.textContent=fmt(141470*p);
    const land=prog(t,11.9,.25);n.style.transform=`scale(${1+0.12*Math.sin(land*Math.PI)})`;
    $('s5c').style.opacity=prog(t,10.6,.3);}
  // S6 CTA
  const s6=vis('s6',t,12.6,99);
  if(s6){whip(s6,t,12.6,99,1);pop($('s6a'),t,12.75);pop($('s6b'),t,13.05,.38);
    const c=$('chev');c.style.opacity=prog(t,13.5,.2);c.style.transform=`translateY(${Math.abs(Math.sin((t-13.5)*4))*22}px)`;}
}
window.seek=seek;seek(0);
</script>
</body></html>
