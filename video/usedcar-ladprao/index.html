<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #17181c; }
      #root { position: relative; width: 100%; height: 100%; }
      #footage, #cutout { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #footage { z-index: 1; }
      #behind { z-index: 2; }
      #cutout { z-index: 3; }
      #front { z-index: 4; }
      #captions { z-index: 5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.0" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="assets/footage.mp4" data-start="0" data-duration="13.0" data-track-index="0" playsinline data-has-audio="true" data-volume="1"></video>

      <div id="behind" data-composition-id="behind" data-composition-src="compositions/behind.html"
        data-start="0" data-duration="13.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <video id="cutout" class="clip" src="assets/cut.webm" data-start="0" data-duration="13.0" data-track-index="2"
        muted playsinline data-layout-allow-occlusion></video>

      <div id="front" data-composition-id="front" data-composition-src="compositions/front.html"
        data-start="0" data-duration="13.0" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="13.0" data-track-index="4" data-track-kind="captions"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
