   const a=-Math.PI/2+(R()-.5)*2.8,v=900+R()*1400;CF.push({d,at:at+R()*.06,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,rs:(R()-.5)*1400})}});
 const sp=$('speed');for(let i=0;i<10;i++){const d=document.createElement('div');d.className='sl';const w=300+R()*500;d.style.width=w+'px';d.style.top=(150+R()*1300)+'px';sp.appendChild(d);SPEED.push({d,w,del:R()*.18})}
 const rays=n=>{let s='';for(let i=0;i<n;i++){const a=i*360/n;s+=`<polygon points="0,0 ${800*Math.cos((a-4)*Math.PI/180)},${800*Math.sin((a-4)*Math.PI/180)} ${800*Math.cos((a+4)*Math.PI/180)},${800*Math.sin((a+4)*Math.PI/180)}" fill="#fff"/>`}return s};
 $('p_rays').innerHTML=rays(20);$('b_rays').innerHTML=rays(18).replaceAll('#fff','#FFE27A');
 for(let i=0;i<18;i++){const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('width',70);e.setAttribute('height',70);e.setAttribute('viewBox','-10 -10 20 20');e.style.position='absolute';
  e.innerHTML=`<path d="M0-10 L2.5-2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5-2.5Z" fill="${i%3?'#fff':'#F5C518'}"/>`;fx.appendChild(e);const a=R()*Math.PI*2;SP.push({e,dx:Math.cos(a),dy:Math.sin(a)*.8,dist:280+R()*320,sc:.6+R()*.9})}

 t_=t;scenes(t);

 else if(t<SEG[3]){
  slam('c_t1',10.95,-6,2.8,.18);addShake(11.05,16,.3);
  slam('c_g0',11.6,0,2.2,.16);S('c_shine',{x:-150+500*eio(P(t,11.75,.5)),r:18,op:t>11.75&&t<12.25?1:0});

 else if(t<SEG[4]){
