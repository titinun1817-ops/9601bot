<!doctype html><meta charset=utf-8>
<style>
/*FONTS*/
:root{--red:#E3202A;--green:#5BB947;--ink:#17181C;--blue:#0B2A6B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:K,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 45%}
.sc{position:absolute;inset:0;display:none}
.abs{position:absolute}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#dip{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
<div id=stage><img id=bg>
<!--STYLE-->
<div id=dip></div><div id=flash></div></div>
<script>
const C=x=>Math.min(1,Math.max(0,x)), P=(t,a,d)=>C((t-a)/d);
const eo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const bo=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const el=x=>x<=0?0:x>=1?1:Math.pow(2,-9*x)*Math.sin((x*9-.75)*2.0944)+1;
const bounce=x=>{x=C(x);const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const $=id=>document.getElementById(id);
function S(e,o={}){if(typeof e==='string')e=$(e);const {op=1,x=0,y=0,s=1,sx=null,sy=null,r=0,b=0}=o;
  e.style.opacity=C(op);e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${sx??s},${sy??s})`;e.style.filter=b>0.05?`blur(${b}px)`:'';}
var SEG=[0,2.5,4.5,6.0,9.5,11.5,13.0], CUTS=[2.5,4.5,6.0,9.5,11.5], BGDIR='../bg/';
function scenes(t){for(let k=0;k<SEG.length-1;k++){const e=$('s'+k);if(e)e.style.display=(t>=SEG[k]&&t<SEG[k+1])?'block':'none'}}
function shake(t,at,amp=16,dur=.35){const k=P(t,at,dur);if(t<at||k>=1)return[0,0];const a=(1-k)*amp;return[Math.sin(t*97)*a,Math.cos(t*83)*a*.6]}
function count(t,a,d,v,ease=eo){return Math.round(v*ease(P(t,a,d))).toLocaleString('en-US')}
let _s=11;const R=()=>(_s=(_s*16807)%2147483647)/2147483647;
function letters(id){const e=$(id);e.innerHTML=[...e.textContent].map(c=>`<span style="display:inline-block;white-space:pre">${c}</span>`).join('');return [...e.children]}
function flashAt(t,cuts,amt=.6,d=.14){let f=0;for(const b of cuts){if(t>=b)f=Math.max(f,amt*(1-P(t,b,d)))}$('flash').style.opacity=f}
window.go=async i=>{const bg=$('bg');bg.src=BGDIR+String(i+1).padStart(4,'0')+'.jpg';await bg.decode();render(i/30)};
window.init=async()=>{await document.fonts.ready;if(window.setup)setup();};
</script>
<!--SCRIPT-->
